<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>Expense &amp; Budget Visualizer</h1>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark/light mode">
          🌙
        </button>
      </div>
      <div id="balance-display" role="status" aria-live="polite">$0.00</div>
    </header>

    <main>
      <div id="storage-error" role="alert"></div>

      <!-- Tab Navigation -->
      <nav class="tab-nav" role="tablist" aria-label="App sections">
        <button class="tab-btn active" role="tab" aria-selected="true"  data-tab="transactions">Transactions</button>
        <button class="tab-btn"        role="tab" aria-selected="false" data-tab="summary">Monthly Summary</button>
      </nav>

      <!-- ===== TRANSACTIONS TAB ===== -->
      <div id="tab-transactions" class="tab-panel" role="tabpanel">

        <section aria-labelledby="form-heading">
          <h2 id="form-heading">Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <div class="field-group">
              <label for="item-name">Item Name</label>
              <input id="item-name" name="itemName" type="text" maxlength="100" />
              <span class="field-error" id="item-name-error" role="alert"></span>
            </div>
            <div class="field-group">
              <label for="amount">Amount</label>
              <input id="amount" name="amount" type="number" min="0.01"
                     max="999999999.99" step="0.01" />
              <span class="field-error" id="amount-error" role="alert"></span>
            </div>
            <div class="field-group">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="">-- Select Category --</option>
              </select>
              <span class="field-error" id="category-error" role="alert"></span>
            </div>
            <button type="submit">Add Transaction</button>
          </form>
        </section>

        <!-- Manage Custom Categories -->
        <section aria-labelledby="cat-heading">
          <h2 id="cat-heading">Manage Categories</h2>
          <div id="category-list" class="category-tags" aria-label="Category list"></div>
          <form id="add-category-form" novalidate>
            <div class="inline-group">
              <input id="new-category" type="text" maxlength="30"
                     placeholder="New category name" aria-label="New category name" />
              <input id="new-category-color" type="color" value="#4a90e2"
                     aria-label="Category color" title="Pick category color" />
              <button type="submit">Add</button>
            </div>
            <span class="field-error" id="new-category-error" role="alert"></span>
          </form>
        </section>

        <section aria-labelledby="list-heading">
          <h2 id="list-heading">Transactions</h2>
          <ul id="transaction-list" aria-label="Transaction list"></ul>
        </section>

        <section aria-labelledby="chart-heading">
          <h2 id="chart-heading">Spending by Category</h2>
          <div id="chart-container">
            <canvas id="pie-chart" aria-label="Spending pie chart" role="img"></canvas>
          </div>
        </section>

      </div><!-- /tab-transactions -->

      <!-- ===== MONTHLY SUMMARY TAB ===== -->
      <div id="tab-summary" class="tab-panel hidden" role="tabpanel">

        <section aria-labelledby="summary-heading">
          <h2 id="summary-heading">Monthly Summary</h2>
          <div class="summary-controls">
            <label for="summary-year">Year</label>
            <select id="summary-year" aria-label="Select year"></select>
          </div>
          <div id="monthly-summary-content"></div>
        </section>

        <section aria-labelledby="bar-chart-heading">
          <h2 id="bar-chart-heading">Monthly Spending</h2>
          <div id="bar-chart-container">
            <canvas id="bar-chart" aria-label="Monthly spending bar chart" role="img"></canvas>
          </div>
        </section>

      </div><!-- /tab-summary -->

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
